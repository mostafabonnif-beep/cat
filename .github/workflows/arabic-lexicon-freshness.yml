name: Arabic Lexicon Freshness

# Keeps the imported Arabic offensive lexicon (safety_terms_arabic.json)
# in sync with the upstream academic repository:
#   https://github.com/mohammedattia/arabic-offensive-words
#
# Runs every Monday; if the upstream README changed since the last import,
# opens a reminder issue so a maintainer can re-run:
#   python scripts/arabic_lexicon_importer.py --merge-blocklist
#   python scripts/export_blocklist_pack.py --version N

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare upstream lexicon hash
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import hashlib, json, urllib.request
          url = ("https://raw.githubusercontent.com/"
                 "mohammedattia/arabic-offensive-words/main/README.md")
          req = urllib.request.Request(url, headers={"User-Agent": "viralcutter-lexicon-watch"})
          upstream = urllib.request.urlopen(req, timeout=20).read()
          digest = hashlib.sha256(upstream).hexdigest()
          try:
              pack = json.load(open("safety_terms_arabic.json", encoding="utf-8"))
              stored = pack.get("upstream_sha256", "")
          except Exception:
              stored = ""
          print("upstream=" + digest)
          print("stored=" + (stored or "none"))
          changed = "yes" if (stored and digest != stored) else "no"
          if not stored:
              changed = "yes"  # first run after this workflow lands
          print("changed=" + changed)
          with open("GITHUB_OUTPUT", "a") as f:
              f.write(f"changed={changed}\n")
              f.write(f"upstream_sha256={digest}\n")
          EOF

      - name: Open reminder issue when upstream changed
        if: steps.compare.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OPEN=$(gh issue list --state open --search 'in:title "Arabic-Lexicon-Update"' --limit 5 --json number -q '.[].number')
          if [ -n "$OPEN" ]; then
            echo "Reminder issue already open (#$OPEN)."
          else
            gh issue create \
              --title "[Arabic-Lexicon-Update] المعجم العربي المسيء تغيّر في المصدر — حدّث القائمة" \
              --body "## 🔔 المعجم الأكاديمي للكلمات المسيئة العربية تغيّر

          المصدر: https://github.com/mohammedattia/arabic-offensive-words

          ### ماذا تفعل
          1. أعد الاستيراد:
             \`\`\`
             python scripts/arabic_lexicon_importer.py --merge-blocklist
             \`\`\`
          2. صدّر الحزمة برقم إصدار جديد:
             \`\`\`
             python scripts/export_blocklist_pack.py --version 5
             \`\`\`
          3. ادفع التغيير — وسيصدر التحديث لكل التثبيتات تلقائياً."
          fi
