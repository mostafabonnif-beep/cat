name: YouTube Policy Watch

# Watches YouTube's official policy pages (Hate speech, Harassment, Violent &
# graphic, Community Guidelines). When a page changes, the moderation
# vocabulary has changed — so the safety blocklist (safety_blocklist.json)
# needs a maintainer review. This workflow:
#
#   * Runs every day (09:00 UTC) and on manual dispatch.
#   * Runs scripts/youtube_policy_watch.py and compares page hashes.
#   * If any policy page changed → opens ONE reminder issue (skipped if one
#     is already open) listing exactly which policy areas changed.
#   * The reminder auto-closes once the blocklist version is bumped past the
#     version recorded when the issue was opened.

on:
  schedule:
    - cron: "0 9 * * *" # daily 09:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the policy watcher
        id: watch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/youtube_policy_watch.py || true
          STATUS="$(python3 -c "
import json, scripts.youtube_policy_watch as w
print(json.dumps(w.check_policy_pages(), ensure_ascii=False))")"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "$STATUS"
          CHANGED="$(python3 -c "
import json,sys
s=json.loads(sys.argv[1])
print('yes' if s.get('status')=='changed' else 'no')" "$STATUS")"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Open reminder issue when a policy page changed
        if: steps.watch.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          WATCH_JSON: ${{ steps.watch.outputs.status }}
        run: |
          set -euo pipefail
          CHANGES="$(python3 -c "
import json,os
s=json.loads(os.environ['WATCH_JSON'])
print(', '.join(s.get('changes', [])) or 'unknown')")"
          MARKERS="$(python3 -c "
import json,os
s=json.loads(os.environ['WATCH_JSON'])
lines=[]
for k,marks in (s.get('markers') or {}).items():
    for m in marks[:3]:
        lines.append('- **' + k + '**: ' + m)
print('\n'.join(lines) or '_no markers extracted_')")"
          OPEN=$(gh issue list --state open --search 'in:title "YouTube-Policy-Change"' --limit 5 --json number -q '.[].number')
          if [ -n "$OPEN" ]; then
            echo "Reminder issue already open (#$OPEN)."
          else
            gh issue create \
              --title "[YouTube-Policy-Change] تغيّرت سياسات يوتيوب ($CHANGES) — راجع قائمة الأمان" \
              --body "## 🔔 تم رصد تغيير في صفحات سياسات يوتيوب الرسمية

          التغيير في: **$CHANGES**

          ### ماذا يعني هذا
          يوتيوب يعدّل صفحاته الرسمية عندما يتغير أسلوب التطبيق — وهذا يترجم غالباً إلى كلمات/عبارات جديدة يجب أن تصل إلى \`safety_blocklist.json\`.

          ### مقتطفات من الصفحات المتغيرة
          $MARKERS

          ### ماذا تفعل
          1. راجع الصفحات المذكورة أعلاه.
          2. أضف أي كلمات جديدة إلى قائمة \`BLOCKLIST\` في \`scripts/safety_filter.py\`.
          3. صدّر الحزمة برقم إصدار جديد:
             \`\`\`
             python scripts/export_blocklist_pack.py --version 3
             \`\`\`
          4. ادفع التغيير — وستتلقى كل التثبيتات التحديث خلال 24 ساعة."
          fi

      - name: Verify the feed committed locally
        shell: bash
        run: |
          set -euo pipefail
          if [ -f youtube_policy_feed.json ]; then
            echo "feed exists:" && head -c 400 youtube_policy_feed.json && echo
          else
            echo "no feed file (offline in this run is OK)"
          fi
